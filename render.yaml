# Blueprint Render — 3 ressources : Redis (Key Value), backend, frontend.
# La base Postgres est externe (Neon) : DATABASE_URL est renseignée à la main
# dans le dashboard (cf. plus bas). Les migrations s'appliquent au démarrage
# du conteneur (cf. CMD du Dockerfile backend : migrate:deploy && start).
# Déploiement : Render Dashboard → New → Blueprint → pointer ce dépôt.

services:
  # --- Redis (pub/sub des messages) ---
  - type: redis
    name: lime-redis
    plan: free
    region: frankfurt # hébergement Europe (UE)
    ipAllowList: [] # connexions internes uniquement

  # --- Backend (Bun + Express + WebSocket) ---
  - type: web
    name: lime-backend
    runtime: docker
    rootDir: chat-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # hébergement Europe (UE)
    envVars:
      # Base Postgres externe (Neon). Coller la connection string Neon
      # (= NEON_LINK, idéalement le pooler "-pooler", avec sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Neon exige TLS : DB_SSL=true active le chiffrement AVEC vérification du
      # certificat (cf. database.ts). Obligatoire ici (DATABASE_URL est requis
      # en prod, le backend refuse de démarrer sans).
      - key: DB_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: lime-redis
          property: connectionString
      - key: CHAT_PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: hello@demomailtrap.co
      - key: MAIL_FROM_NAME
        value: Lime
      # À renseigner manuellement (secret + URL connue après 1er déploiement) :
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_INBOX_ID
        sync: false
      # URL HTTPS du frontend (CORS) — coller après le 1er déploiement du front.
      - key: CLIENT_ORIGIN
        sync: false

  # --- Frontend (Next.js) ---
  - type: web
    name: lime-frontend
    runtime: docker
    rootDir: chat-client
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # hébergement Europe (UE)
    envVars:
      # URL HTTPS du backend — inlinée au BUILD (cf. ARG dans le Dockerfile).
      # Coller l'URL de lime-backend, puis redéployer pour rebâtir le bundle.
      - key: NEXT_PUBLIC_API_URL
        sync: false
